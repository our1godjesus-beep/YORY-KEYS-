name: iOS CI

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create local Supabase client configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          target = Path("ios/YORYKeys/SupabaseConfig.plist")
          target.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "SUPABASE_URL": os.environ.get("SUPABASE_URL", ""),
              "SUPABASE_PUBLISHABLE_KEY": os.environ.get("SUPABASE_PUBLISHABLE_KEY", ""),
          }
          with target.open("wb") as stream:
              plistlib.dump(payload, stream, fmt=plistlib.FMT_XML, sort_keys=True)
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build app and keyboard extension
        working-directory: ios
        run: |
          xcodebuild -project YORYKeys.xcodeproj -scheme YORYKeys -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent "build/DerivedData/Build/Products/Debug-iphonesimulator/YORY KEYS.app" "build/YORY-Keys-iOS-Simulator.zip"
      - name: Upload iOS Simulator app bundle
        uses: actions/upload-artifact@v4
        with:
          name: yory-keys-ios-simulator-app
          path: ios/build/YORY-Keys-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
